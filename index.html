<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#22272a" />
    <title>Пепельный караван — прототип</title>
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">СЕРЫЙ ПРОТОТИП · M1</p>
          <h1>Пепельный караван</h1>
        </div>
        <button id="reset-game" class="button button-muted" type="button">Сбросить</button>
      </header>

      <section class="resource-panel" aria-live="polite">
        <div>
          <span class="label">Лом</span>
          <strong id="scrap-value">0</strong>
        </div>
        <div>
          <span class="label">Доход</span>
          <strong id="income-value">0 / с</strong>
        </div>
        <div>
          <span class="label">Чертежи в запасе</span>
          <strong id="blueprint-value">0</strong>
        </div>
        <div>
          <span class="label">Жетоны</span>
          <strong id="token-value">0</strong>
        </div>
      </section>

      <section class="route-panel">
        <div class="section-heading">
          <h2>Маршрут</h2>
          <span id="finds-hint">Нажимайте на находки</span>
        </div>
        <div class="route-controls">
          <label for="zone-select">Зона</label>
          <select id="zone-select" aria-label="Выбрать зону"></select>
          <button id="visit-zone" class="button button-small" type="button" hidden>Перейти</button>
          <button id="airship-button" class="button" type="button" hidden>Дирижабль!</button>
        </div>
        <div class="route-progress">
          <div class="route-progress-heading">
            <span id="route-progress-label">Маршрут</span>
            <span id="route-progress-value">0%</span>
          </div>
          <div id="route-progress-track" class="route-progress-track" role="progressbar" aria-label="Прогресс до следующей зоны" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="route-progress-fill" class="route-progress-fill">
            </div>
            <span class="route-caravan" aria-hidden="true">🚚</span>
          </div>
          <button id="advance-zone" class="button" type="button" hidden>Перейти в следующую зону</button>
        </div>
        <div id="route-scene" class="route-scene" aria-label="Дорога каравана и находки">
          <div id="finding-layer" class="finding-layer"></div>
        </div>
      </section>

      <nav id="game-tabs" class="game-tabs" aria-label="Игровые разделы">
        <button type="button" data-tab="route" class="is-active">Маршрут</button>
        <button type="button" data-tab="upgrades">Улучшения</button>
        <button type="button" data-tab="orders">Просьбы</button>
        <button type="button" data-tab="workshop">Мастерская</button>
        <button type="button" data-tab="rewards">Награды</button>
        <button type="button" data-tab="leaderboard">Топ</button>
      </nav>
      <section id="tab-view" class="fleet-panel" aria-live="polite"></section>

      <div id="offline-notice" class="notice offline-notice" role="status" hidden></div>
      <p id="action-notice" class="notice" hidden></p>
      <p id="game-error" class="error" role="alert" hidden></p>
      <footer>Локальная игра работает без сети. Облако и глобальный лидерборд доступны через SDK Яндекс Игр.</footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
